<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNFRAME | U#</title>
    <meta name="description" content="UNFRAME 매거진 U#. 에디션 번호로 발행하는 전시·예술 기록." data-uf-og />
    <meta property="og:site_name" content="UNFRAME | U#" data-uf-og />
    <meta property="og:type" content="website" data-uf-og />
    <meta property="og:title" content="UNFRAME | U#" data-uf-og />
    <meta property="og:description" content="UNFRAME 매거진 U#. 에디션 번호로 발행하는 전시·예술 기록." data-uf-og />
    <meta property="og:image" content="https://magazine.unframe.kr/icons/icon-512.png" data-uf-og />
    <meta name="twitter:card" content="summary" data-uf-og />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfc" />
    <meta name="background-color" content="#fcfcfc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="U#" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />

    <style>
      body {
        font-family: "Pretendard", sans-serif;
      }
    </style>
  </head>
  <body>
    <script>
      (() => {
        const STORAGE_KEY = "uf_theme_preference";
        const DARK_COLOR = "#09090b";
        const LIGHT_COLOR = "#fcfcfc";
        const root = document.documentElement;
        const body = document.body;
        const prefersDark =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

        let preference = "system";
        try {
          const stored = window.localStorage.getItem(STORAGE_KEY);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch {
          // localStorage may be unavailable in private or restricted contexts.
        }

        const resolved =
          preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        const isDark = resolved === "dark";

        root.classList.toggle("dark", isDark);
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
        root.style.backgroundColor = isDark ? DARK_COLOR : LIGHT_COLOR;
        root.style.color = isDark ? "#f4f4f5" : "#111111";

        if (body) {
          body.classList.toggle("dark", isDark);
          body.dataset.theme = resolved;
          body.style.colorScheme = resolved;
          body.style.backgroundColor = isDark ? DARK_COLOR : LIGHT_COLOR;
          body.style.color = isDark ? "#f4f4f5" : "#111111";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
