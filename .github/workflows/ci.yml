name: CI

on:
  push:
    branches: [main, refactor-safe]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Runs only against the local emulator; never touches the production project.
      - run: >
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-unframe-mag
          "FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 node --test tests/firestore.rules.mjs"
